<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson JSON Generator</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; color: #333; }
  h1 { text-align: center; margin-bottom: 20px; }
  label { display: block; margin-top: 15px; font-weight: bold; }
  input, textarea { width: 100%; padding: 8px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; }
  textarea { resize: vertical; min-height: 60px; }
  button { margin-top: 20px; padding: 10px 20px; border:none; border-radius:6px; background: #01478b; color:#fff; cursor:pointer; font-weight:600; }
  button:hover { background: #012f5a; }

  .token-word, .answer-word {
    display:inline-block;
    margin:3px;
    padding:3px 6px;
    border-radius:4px;
    background:#d1e0ff;
    cursor:pointer;
    user-select:none;
  }
  .token-word:hover { background:#a0c4ff; }
  .answer-word { background:#ffd1d1; }
</style>
</head>
<body>

<h1>Lesson JSON Generator</h1>

<form id="lessonForm">
  <label>Title:</label>
  <input type="text" id="title" required>

  <label>Reference (used for filename):</label>
  <input type="text" id="reference" required>

  <label>Personal Development Stage:</label>
  <input type="text" id="pds" required>

  <label>Lesson Overview:</label>
  <textarea id="overview"></textarea>

  <label>CDI Framework Links:</label>
  <textarea id="cdiLinks"></textarea>

  <label>Introduction:</label>
  <label>In this lesson, you will explore:</label>
  <textarea id="introduction"></textarea>

  <label>Success Criteria:</label>
  <textarea id="successCriteria"></textarea>

  <label>Key Words:</label>
  <textarea id="keywords"></textarea>

  <h3>Kahoot Quiz Slide (optional)</h3>

  <label>Kahoot Quiz Link (Teacher link):</label>
  <input type="text" id="kahootLink" placeholder="Paste Kahoot host link here">
    <label>Quick Questions:</label>
    <textarea id="quickQuestions"></textarea>

  <h3>Learning Slides (up to 5)</h3>
  <label>Slide 1 Title:</label>
  <input type="text" id="slide1Title">
  <label>Slide 1 Text:</label>
  <textarea id="slide1Text"></textarea>

  <label>Slide 2 Title:</label>
  <input type="text" id="slide2Title">
  <label>Slide 2 Text:</label>
  <textarea id="slide2Text"></textarea>

  <label>Slide 3 Title:</label>
  <input type="text" id="slide3Title">
  <label>Slide 3 Text:</label>
  <textarea id="slide3Text"></textarea>

  <label>Slide 4 Title:</label>
  <input type="text" id="slide4Title">
  <label>Slide 4 Text:</label>
  <textarea id="slide4Text"></textarea>

  <label>Slide 5 Title:</label>
  <input type="text" id="slide5Title">
  <label>Slide 5 Text:</label>
  <textarea id="slide5Text"></textarea>

  <label>Activity Overview (one sentence):</label>
  <textarea id="activity"></textarea>

  <h3>Interactive Cloze Activity Builder</h3>
  <label>Activity ID:</label>
  <input type="text" id="clozeId" placeholder="cloze_1">

  <label>Title:</label>
  <input type="text" id="clozeTitle" placeholder="Complete the Sentence">

  <label>Enter Sentence:</label>
  <textarea id="clozeSentenceInput" placeholder="Maintaining balance supports longterm success and happiness."></textarea>

  <button type="button" id="tokeniseBtn">Tokenise Sentence</button>

  <div id="tokenContainer" style="margin-top:10px; font-size:16px;"></div>

  <h4>Answer Bank (click to remove a word from blanks)</h4>
  <div id="answerBank" style="margin-top:10px; font-size:16px; min-height:30px;"></div>

  <label>Key Takeaways:</label>
  <textarea id="takeaways"></textarea>

  <button type="button" id="generateBtn">Generate JSON</button>
</form>

<script>
// Auto-populate cloze ID
window.addEventListener('DOMContentLoaded', () => {
  const clozeInput = document.getElementById('clozeId');
  if(!clozeInput.value.trim()) clozeInput.value = "cloze_1";
});

// Tokenise sentence
document.getElementById('tokeniseBtn').addEventListener('click', () => {
  const sentence = document.getElementById('clozeSentenceInput').value.trim();
  const tokenContainer = document.getElementById('tokenContainer');
  const answerBank = document.getElementById('answerBank');

  tokenContainer.innerHTML = '';
  answerBank.innerHTML = '';

  if(!sentence) return;

  sentence.split(/\s+/).forEach(word => {
    const span = document.createElement('span');
    span.textContent = word;
    span.classList.add('token-word');
    span.addEventListener('click', () => {
      span.textContent = '______';
      span.classList.remove('token-word');
      span.classList.add('blank-word');

      const answer = document.createElement('span');
      answer.textContent = word;
      answer.classList.add('answer-word');
      answer.addEventListener('click', () => {
        const firstBlank = tokenContainer.querySelector('.blank-word');
        if(firstBlank){
          firstBlank.textContent = word;
          firstBlank.classList.remove('blank-word');
          firstBlank.classList.add('token-word');
        }
        answer.remove();
      });
      answerBank.appendChild(answer);
    });
    tokenContainer.appendChild(span);
    tokenContainer.appendChild(document.createTextNode(' '));
  });
});

// Helper to shuffle array
function shuffleArray(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// Generate JSON
document.getElementById('generateBtn').addEventListener('click', () => {
  const reference = document.getElementById('reference').value.trim();
  if(!reference){ alert('Reference is required for filename.'); return; }

  const slides = [];
  for(let i=1;i<=5;i++){
    const title=document.getElementById(`slide${i}Title`).value.trim();
    const text=document.getElementById(`slide${i}Text`).value.trim();
    const bullets=text.split("\n").map(l=>l.trim()).filter(l=>l);
    if(title||bullets.length) slides.push({slide_index:slides.length,type:"content",title:title||`Slide ${i}`,bullets});
  }

  const lessonJSON=[
    {slide_index:0,type:"content",title:document.getElementById('title').value,reference,
     pds_stage:document.getElementById('pds').value,text:document.getElementById('overview').value,
     cdi_links:document.getElementById('cdiLinks').value},
    {slide_index:1,type:"content",title:"Introduction",text:"In this lesson, you will explore",
  bullets:document.getElementById('introduction').value
    .split("\n")
    .map(l => l.trim())
    .filter(l => l)},
    {slide_index:2,type:"content",title:"Success Criteria",
     bullets:document.getElementById('successCriteria').value.split("\n").map(l=>l.trim()).filter(l=>l)},
    {slide_index:3,type:"content",title:"Key Words",
     bullets:document.getElementById('keywords').value.split(/\n/).map(l=>l.trim()).filter(l=>l)},
      // --- Optional Kahoot Slide ---
];
const kahootLink = document.getElementById('kahootLink').value.trim();

      if (kahootLink) {
        lessonJSON.push({
          slide_index: lessonJSON.length,
          type: "kahoot",
          title: "Kahoot Quiz",
          kahoot_link: kahootLink
        });
      } 

     lessonJSON.push({
  slide_index: lessonJSON.length,
  type:"discussion",
  title:"Quick Questions",
  text:document.getElementById('quickQuestions').value.split("\n").map(l=>l.trim()).filter(l=>l)
});

slides.forEach(s=>{
  lessonJSON.push({
    slide_index: lessonJSON.length,
    type:"content",
    title:s.title,
    bullets:s.bullets
  });
});

lessonJSON.push({
  slide_index: lessonJSON.length,
  type:"activity",
  title:"Activity",
  text:document.getElementById('activity').value
});
    


  // --- Cloze Slide ---
  let clozeId = document.getElementById('clozeId').value.trim();
  if (!clozeId) clozeId = "cloze_1";  // fallback

  const tokenContainer = document.getElementById('tokenContainer');
  const answerBank = document.getElementById('answerBank');
  const rawSentence = document.getElementById('clozeSentenceInput').value.trim();
  const sentenceTokens = Array.from(tokenContainer.querySelectorAll('span')).map(s => s.textContent).join(' ') || rawSentence;

  // Take up to 2 answers
  const answers = Array.from(answerBank.children).map(a => a.textContent).slice(0, 2);
  if (answers.length === 0) alert("Warning: No blanks selected. Cloze will have empty answer bank.");

  // Pull distractors from keywords (single words only)
  const rawKeywords = document.getElementById('keywords').value
    .split(/\n|,|;/)
    .map(k => k.trim().split(/\s+/)[0])
    .filter(k => k && !answers.includes(k));

  // Combine answers + distractors with no duplicates
  const optionsSet = new Set([...answers]);
  rawKeywords.slice(0, 4).forEach(k => optionsSet.add(k));
  const options = shuffleArray([...optionsSet].map(o => o.toLowerCase()));

  lessonJSON.push({
    slide_index: lessonJSON.length,
    type: "cloze",
    activity_id: clozeId,
    title: document.getElementById('clozeTitle').value.trim() || "Cloze Activity",
    sentence: sentenceTokens,
    answers: answers,
    options: options
  });

  lessonJSON.push({
  slide_index: lessonJSON.length,
  type: "content",
  title: "Key Takeaways",
  text: document.getElementById('takeaways').value
    .split("\n")
    .map(l => l.trim())
    .filter(l => l)
});

  const blob=new Blob([JSON.stringify(lessonJSON,null,2)],{type:"application/json"});
  const link=document.createElement('a');
  link.href=URL.createObjectURL(blob);
  link.download=reference+".json";
  link.click();
});
</script>

</body>
</html>
