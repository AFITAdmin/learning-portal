<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Board</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body {
    font-family: "Segoe UI", sans-serif;
    background: #b8ffee;
    color: #000000;
    margin:0;
    padding:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }

  #boardContainer {
    width: 90%;
    max-width: 1200px;
    text-align: center;   /* center everything */
  }

  h1 {
    font-size: 5rem;      /* big for slide titles */
    margin-bottom: 2rem;
  }

  p {
    font-size: 2.5rem;    /* larger paragraph text */
    line-height: 1.4;
    margin-bottom: 2rem;
  }

  ul {
    font-size: 3rem;      /* bullet points larger */
    line-height: 1.6;
    margin-bottom: 2rem;
    padding-left: 2.5rem;
    text-align: left;     /* bullets aligned left */
  }

  .discussion-box, .activity-box {
    border: 5px solid #5c2083;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 2rem;
    background: rgba(255,255,255,0.1);
    font-size: 2.5rem;    /* text inside boxes enlarged */
    line-height: 1.5;
  }

  button.option {
    font-size: 2rem;       /* bigger buttons for clarity */
    padding: 15px 25px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  button.correct {
    background: green;
    color: white;
  }

  button.incorrect {
    background: red;
    color: white;
  }

  #boardContainer ul {
  font-size: 2rem;       /* or whatever fits your presentation */
  line-height: 4rem;
  margin-bottom: 2rem;
  padding-left: 2.5rem;  /* make bullets indent nicely */
}

#boardContainer li {
  font-size: 2rem;
  line-height: 4rem;
}
</style>
</head>
<body>

<div id="boardContainer"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="board.js"></script>

</body>
</html>
